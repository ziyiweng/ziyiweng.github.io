# Compiles cv-src/cv.tex and publishes it at https://ziyiweng.github.io/CV/CV.pdf
# Runs on every push to main, or manually from the Actions tab.
name: Build CV & deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compile LaTeX CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          working_directory: cv-src

      - name: Assemble site (just the PDF)
        run: |
          mkdir -p _site/CV
          cp cv-src/cv.pdf _site/CV/CV.pdf
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV · Ziyi Weng</title>
  <style>
    :root { --navy: #264073; --ink: #1d1d1f; --muted: #6b6b70; --bg: #fafafa; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Latin Modern Roman", "Computer Modern Serif", Georgia, serif;
      color: var(--ink); background: var(--bg);
      display: flex; flex-direction: column;
    }
    header {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: .75rem 1.5rem;
      padding: 1rem 1.5rem; border-bottom: 2px solid var(--navy); background: #fff;
    }
    header h1 { margin: 0; font-size: 1.4rem; color: var(--navy); }
    header .meta { color: var(--muted); font-size: .95rem; }
    header nav { margin-left: auto; display: flex; gap: 1rem; }
    a { color: var(--navy); }
    .btn {
      text-decoration: none; padding: .35rem .8rem; border: 1px solid var(--navy);
      border-radius: 4px; font-size: .95rem;
    }
    .btn.primary { background: var(--navy); color: #fff; }
    main { flex: 1; display: flex; }
    object { flex: 1; width: 100%; min-height: 80vh; border: 0; }
    .fallback { margin: 3rem auto; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>Ziyi Weng — Curriculum Vitae</h1>
    <span class="meta">Last updated: {{LAST_UPDATED}}</span>
    <nav>
      <a class="btn" href="../">Home</a>
      <a class="btn primary" href="Ziyi_Weng_CV.pdf" download>Download PDF</a>
    </nav>
  </header>
  <main>
    <object data="Ziyi_Weng_CV.pdf#view=FitH" type="application/pdf">
      <p class="fallback">Your browser can't display the PDF inline.
        <a href="Ziyi_Weng_CV.pdf">Open the CV (PDF)</a></p>
    </object>
  </main>
</body>
</html>
